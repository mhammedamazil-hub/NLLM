name: CI and static PWA deployment
on:
  push:
    branches: [main, arena/53208eb5-nllm]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  web-tests:
    name: Web, browser, and Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
        run: |
          if cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1; then
            cat /tmp/clippy.log
          else
            status=$?
            cat /tmp/clippy.log
            python3 - <<'PY'
          from pathlib import Path
          message = ' '.join(Path('/tmp/clippy.log').read_text(errors='replace').split())[-4000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Clippy diagnostics::{message}')
          PY
            exit "$status"
          fi
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
  release-source:
    if: github.event_name == 'release'
    needs: web-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sourceforge-static-pwa
          path: |
            dist/
            README.md
            LICENSE
            docs/THIRD_PARTY.md
